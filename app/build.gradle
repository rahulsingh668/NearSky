plugins { id 'com.android.application' }
android {
    namespace 'com.nearsky.tv'
    compileSdk 35
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.nearsky.tv'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.5.2'
        testInstrumentationRunner 'com.nearsky.tv.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies { implementation files('libs/androidsvg-1.4.jar') }
