<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">IndiGo A320neo-style livery — NearSky review sample</title>
<desc id="desc">Editable hand-drawn aircraft illustration based on IndiGo's standard white, indigo and sky-blue livery. Enlarged redrawn brand lettering. Design review sample, not an official aircraft paint specification.</desc>
