<linearGradient id="engine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4663A5"/><stop offset=".25" stop-color="#203F91"/><stop offset=".65" stop-color="#12327A"/><stop offset="1" stop-color="#0A1C4E"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#3D6579"/><stop offset=".55" stop-color="#0E293C"/><stop offset="1" stop-color="#142231"/></linearGradient>
